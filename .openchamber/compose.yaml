services:
  dev:
    image: node:24.22.3-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-ec", "npm ci --ignore-scripts && exec sleep infinity"]
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
      WORKTREE_MARKER: "${COMPOSE_PROJECT_NAME:?}"
    healthcheck:
      test: ["CMD", "test", "-f", "node_modules/pg/package.json"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: demo
      POSTGRES_DB: demo
      POSTGRES_PASSWORD: demo
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
